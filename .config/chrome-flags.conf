# /usr/bin/google-chrome-stable 래퍼가 이 파일을 읽어 인자로 넘긴다.
# 주석(#)으로 시작하는 줄은 래퍼가 걸러낸다.

# Tiger Lake iGPU 의 iHD 드라이버는 H.264 / VP9 / AV1 디코딩을 모두 지원한다.
# 이 플래그가 없으면 Chrome 이 전부 CPU 로 디코딩한다.
--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoEncoder,AcceleratedVideoDecodeLinuxGL

# Wayland 네이티브. auto 는 세션이 Wayland 가 아니면 X11 로 자동 폴백한다.
--ozone-platform-hint=auto
