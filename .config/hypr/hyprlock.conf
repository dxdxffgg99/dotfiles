$font = JetBrainsMono Nerd Font
$accent = rgba(88, 166, 255, 0.95)
$accent2 = rgba(188, 140, 255, 0.95)
$muted = rgba(145, 152, 161, 0.95)
$bg = rgba(13, 17, 23, 0.75)

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

general {
    hide_cursor = false
}

background {
    monitor =
    path = /home/kr-dev/.config/lockwp.png
    color = rgba(13, 17, 23, 1.0)
}

input-field {
    monitor =
    size = 16%, 4.2%
    outline_thickness = 2
    inner_color = rgba(13, 17, 23, 0.55)
    outer_color = $accent $accent2 45deg
    check_color = $accent2 $accent 120deg
    fail_color = rgba(240, 136, 62, 0.95)
    font_color = rgb(240, 246, 252)
    fade_on_empty = false
    rounding = 9999
    dots_size = 0.40
    dots_spacing = 0.28
    font_family = $font
    placeholder_text = password
    fail_text = $PAMFAIL
    position = 0, -110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%H:%M"
    font_size = 72
    font_family = $font
    color = rgb(255, 255, 255)
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = $font
    color = $muted
    position = 0, 40
    halign = center
    valign = center
}

